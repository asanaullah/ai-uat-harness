# Assisted by Claude Opus
# Namespaces, PVCs, ServiceAccount, RBAC and NetworkPolicies for the non-admin
# test namespaces.
# The admin namespace is in admin-namespace-and-pvcs.yaml.
# ---- Namespaces ----
apiVersion: v1
kind: Namespace
metadata:
  name: uat-project
  labels:
    massopen.cloud/project: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: uat-peer
  labels:
    massopen.cloud/project: "true"
---
# ---- PVCs ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-project-storage
  namespace: uat-project
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pure-fb-nfsv4
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-peer-storage
  namespace: uat-peer
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pure-fb-nfsv4
  resources:
    requests:
      storage: 50Gi
---
# ---- Model PVCs (pre-downloaded model weights) ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-models
  namespace: uat-project
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pure-fb-nfsv4
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-models
  namespace: uat-peer
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pure-fb-nfsv4
  resources:
    requests:
      storage: 100Gi
---
# ---- uat-project RBAC ----
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-user-role
  namespace: uat-project
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["kubeflow.org"]
    resources: ["pytorchjobs", "tfjobs", "mpijobs", "xgboostjobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices", "servingruntimes"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayclusters", "rayservices"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-user-binding
  namespace: uat-project
subjects:
  - kind: User
    name: asanaull@redhat.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: uat-user-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- uat-peer RBAC ----
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-user-role
  namespace: uat-peer
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-user-binding
  namespace: uat-peer
subjects:
  - kind: User
    name: asanaull@redhat.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: uat-user-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- uat-runner Namespace ----
apiVersion: v1
kind: Namespace
metadata:
  name: uat-runner
  labels:
    massopen.cloud/project: "true"
---
# ---- uat-runner PVC (repo clone, build outputs, per-run logs + metadata) ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-runner-storage
  namespace: uat-runner
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pure-fb-nfsv4
  resources:
    requests:
      storage: 100Gi
---
# ---- uat-runner bin PVC (holds the oc binary staged by the init container) ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-runner-bin
  namespace: uat-runner
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pure-fb-nfsv4
  resources:
    requests:
      storage: 10Gi
---
# ---- uat-runner ServiceAccount (drives runs unattended) ----
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-runner-sa
  namespace: uat-runner
---
# ---- uat-runner self-namespace Role (inspect its own runner pod + config) ----
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-runner-role
  namespace: uat-runner
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-runner-sa-self-binding
  namespace: uat-runner
subjects:
  - kind: ServiceAccount
    name: uat-runner-sa
    namespace: uat-runner
roleRef:
  kind: Role
  name: uat-runner-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- uat-runner operator Role (human launches/inspects the runner pod) ----
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-runner-user-role
  namespace: uat-runner
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-runner-user-binding
  namespace: uat-runner
subjects:
  - kind: User
    name: asanaull@redhat.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: uat-runner-user-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- Bind uat-runner-sa to the test-user role in each target namespace ----
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-runner-sa-project-binding
  namespace: uat-project
subjects:
  - kind: ServiceAccount
    name: uat-runner-sa
    namespace: uat-runner
roleRef:
  kind: Role
  name: uat-user-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-runner-sa-peer-binding
  namespace: uat-peer
subjects:
  - kind: ServiceAccount
    name: uat-runner-sa
    namespace: uat-runner
roleRef:
  kind: Role
  name: uat-user-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- NetworkPolicies (allow same-namespace traffic and outbound internet) ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: uat-project
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: uat-peer
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
