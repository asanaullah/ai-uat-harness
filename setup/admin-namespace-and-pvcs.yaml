# Assisted by Claude Opus
# Admin namespace, PVC, ServiceAccount, RBAC and NetworkPolicy for the admin
# (Category 2) platform checks. Needs cluster-admin to apply: it creates a ClusterRole and
# ClusterRoleBinding. The non-admin namespaces are in
# user-namespaces-and-pvcs.yaml.
# ---- Namespace ----
apiVersion: v1
kind: Namespace
metadata:
  name: uat-admin
  labels:
    massopen.cloud/project: "true"
---
# ---- PVC ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uat-admin-storage
  namespace: uat-admin
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pure-fb-nfsv4
  resources:
    requests:
      storage: 50Gi
---
# ---- uat-admin ServiceAccount ----
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uat-sa
  namespace: uat-admin
---
# ---- uat-admin RBAC (namespace-scoped) ----
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uat-admin-role
  namespace: uat-admin
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices", "servingruntimes"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-sa-admin-role
  namespace: uat-admin
subjects:
  - kind: ServiceAccount
    name: uat-sa
    namespace: uat-admin
roleRef:
  kind: Role
  name: uat-admin-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uat-user-binding
  namespace: uat-admin
subjects:
  - kind: User
    name: asanaull@redhat.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: uat-admin-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- uat-admin RBAC (cluster-scoped, for Category 2 checks) ----
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: uat-admin-cluster-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["datasciencecluster.opendatahub.io"]
    resources: ["datascienceclusters"]
    verbs: ["get", "list"]
  - apiGroups: ["dscinitialization.opendatahub.io"]
    resources: ["dscinitializations"]
    verbs: ["get", "list"]
  - apiGroups: ["nvidia.com"]
    resources: ["clusterpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["nfd.openshift.io"]
    resources: ["nodefeaturediscoveries"]
    verbs: ["get", "list"]
  - apiGroups: ["maistra.io"]
    resources: ["servicemeshcontrolplanes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: uat-sa-admin-cluster-role
subjects:
  - kind: ServiceAccount
    name: uat-sa
    namespace: uat-admin
roleRef:
  kind: ClusterRole
  name: uat-admin-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
# ---- NetworkPolicy (allow same-namespace traffic and outbound internet) ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: uat-admin
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
