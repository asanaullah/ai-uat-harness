# Assisted by Claude Opus
# The admin run does not need a node inventory. The compliance test lists
# nodes itself. This file only names the namespace, the claim and the runner.
all:
  vars:
    uat_cluster_name: uat-admin
    uat_namespace: uat-admin
    uat_storage:
      pvc: uat-admin-storage
      basePath: uat/results
    uat_runner:
      namespace: uat-admin
      serviceAccount: uat-admin-sa
      pvc: uat-admin-storage
