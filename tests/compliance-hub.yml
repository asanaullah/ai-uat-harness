# Assisted by Claude Opus
- name: Plan compliance-hub
  ansible.builtin.import_playbook: ../plugins/playbooks/sequences.yml
  vars:
    uat_test: compliance-hub
    uat_modes: [project]

- name: compliance-hub
  hosts: "{{ hostvars.localhost.uat_hosts | default('uat_none') }}"
  serial: "{{ hostvars.localhost.uat_serial | default(0) }}"
  gather_facts: false
  vars:
    serverConfig:
      namespace: uat-admin
      serviceAccount: uat-admin-sa
      # NodePools whose node count is not enforced, as a regex over
      # "<cluster>/<nodepool>". A cluster can be parked on purpose: a GPU VM
      # worker is often stopped between runs so it does not hold its GPUs,
      # and then 0 of 1 nodes is the intended state rather than a fault.
      parkedNodePools: "{{ (uat_compliance | default({})).parkedNodePools | default('') }}"
  tasks:
    - name: Start the sequence
      ansible.builtin.import_role:
        name: uat_sequence

    - name: Steps
      block:
        - name: checker
          ansible.builtin.include_role:
            name: uat_pod
          vars:
            step:
              name: checker
              serviceAccountName: uat-admin-sa
              image: registry.access.redhat.com/ubi9/ubi:9.8
              timeout: 1800
              labelFilter: pass-fail
              env:
                - name: UAT_ADMIN_NAMESPACE
                  value: "{{ serverConfig.namespace }}"
                - name: PARKED_NODEPOOLS
                  value: "{{ serverConfig.parkedNodePools }}"
      rescue:
        - name: Handle the failure
          ansible.builtin.import_role:
            name: uat_sequence
            tasks_from: failed
      always:
        - name: Tear down
          ansible.builtin.import_role:
            name: uat_sequence
            tasks_from: teardown
