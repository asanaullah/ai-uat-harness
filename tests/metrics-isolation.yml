# Assisted by Claude Opus
- name: Plan metrics-isolation
  ansible.builtin.import_playbook: ../plugins/playbooks/sequences.yml
  vars:
    uat_test: metrics-isolation
    uat_modes: [project]

- name: metrics-isolation
  hosts: "{{ hostvars.localhost.uat_hosts | default('uat_none') }}"
  serial: "{{ hostvars.localhost.uat_serial | default(0) }}"
  gather_facts: false
  vars:
    serverConfig:
      projectNamespace: "{{ uat_namespace }}"
      peerNamespace: "{{ uat_peer_namespace }}"
    canaryMetricName: uat_canary_metric
    canaryMetric: '{{ canaryMetricName }}{run="{{ uat_run_id }}"} 1'
    thanosQuerier: https://thanos-querier.openshift-monitoring.svc.cluster.local
    thanosTenancy: "{{ thanosQuerier }}:9092"
    thanosWeb: "{{ thanosQuerier }}:9091"
    readerSecretName: "uat-{{ uat_tid }}-{{ uat_seq.qid }}-reader-token"
  tasks:
    - name: Start the sequence
      ansible.builtin.import_role:
        name: uat_sequence

    - name: Steps
      block:
        # The check acts as the identity these playbooks run under, through a
        # Secret torn down with the sequence.
        - name: Read the in-pod service account token
          ansible.builtin.set_fact:
            reader_token: "{{ lookup('ansible.builtin.file', '/var/run/secrets/kubernetes.io/serviceaccount/token', errors='ignore') | trim }}"
          when: not uat_dry_run | bool

        - name: Read the token from the kubeconfig
          ansible.builtin.set_fact:
            reader_token: "{{ (_kube.users | selectattr('user.token', 'defined') | map(attribute='user.token') | first | default('')) | trim }}"
          vars:
            kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') ~ '/.kube/config', true)
                            | replace('~', lookup('env', 'HOME')) | split(':') | first }}"
            _kube: "{{ (lookup('ansible.builtin.file', kubeconfig, errors='ignore') | default('', true) | from_yaml) or {} }}"
          when: not uat_dry_run | bool and (reader_token | default('')) | length == 0

        - name: Stop without a token to query with
          ansible.builtin.fail:
            msg: >-
              No token found to query Thanos Querier with. Run from the runner pod (-p),
              or from a machine logged in with oc login as a member of the project group.
          when: not uat_dry_run | bool and (reader_token | default('')) | length == 0

        - name: Give the project check the reader's token
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: "{{ readerSecretName }}"
                namespace: "{{ serverConfig.projectNamespace }}"
                labels: "{{ uat_seq_labels | combine({'app.kubernetes.io/managed-by': uat_managed_by}) }}"
              type: Opaque
              stringData:
                token: "{{ reader_token }}"
          when: not uat_dry_run | bool

        - name: Tear the reader token down with the sequence
          ansible.builtin.set_fact:
            uat_seq_objects: "{{ uat_seq_objects + [{'api_version': 'v1', 'kind': 'Secret', 'namespace': serverConfig.projectNamespace}] }}"
          when: not uat_dry_run | bool

        - name: project-canary
          ansible.builtin.include_role:
            name: uat_pod
          vars:
            step:
              name: project-canary
              image: registry.redhat.io/ubi9/ubi:9.8
              labels:
                uat/canary: project
              command:
                args:
                  - bash
                  - -c
                  - >-
                    mkdir -p /tmp/canary &&
                    printf '%s\n' '{{ canaryMetric }}' > /tmp/canary/metrics &&
                    exec python3 -m http.server 8080 --directory /tmp/canary
              service:
                enabled: true
                port: 8080
                name: project-canary
                headless: true
              ports:
                - containerPort: 8080
                  name: metrics
                  protocol: TCP
              readinessProbe:
                httpGet: {path: /metrics, port: 8080}
                initialDelaySeconds: 2
                periodSeconds: 5
                failureThreshold: 6
              persistsThroughSweep: true

        - name: peer-canary
          ansible.builtin.include_role:
            name: uat_pod
          vars:
            step:
              name: peer-canary
              image: registry.redhat.io/ubi9/ubi:9.8
              peer: true
              labels:
                uat/canary: peer
              command:
                args:
                  - bash
                  - -c
                  - >-
                    mkdir -p /tmp/canary &&
                    printf '%s\n' '{{ canaryMetric }}' > /tmp/canary/metrics &&
                    exec python3 -m http.server 8080 --directory /tmp/canary
              service:
                enabled: true
                port: 8080
                name: peer-canary
                headless: true
              ports:
                - containerPort: 8080
                  name: metrics
                  protocol: TCP
              readinessProbe:
                httpGet: {path: /metrics, port: 8080}
                initialDelaySeconds: 2
                periodSeconds: 5
                failureThreshold: 6
              persistsThroughSweep: true

        - name: project-podmonitor
          ansible.builtin.include_role:
            name: uat_resource
          vars:
            step:
              name: project-podmonitor
              resourceConfig:
                apiVersion: monitoring.coreos.com/v1
                kind: PodMonitor
                spec:
                  selector:
                    matchLabels:
                      uat/canary: project
                      uat/run: "{{ uat_run_id }}"
                  podMetricsEndpoints:
                    - port: metrics

        - name: peer-podmonitor
          ansible.builtin.include_role:
            name: uat_resource
          vars:
            step:
              name: peer-podmonitor
              peer: true
              resourceConfig:
                apiVersion: monitoring.coreos.com/v1
                kind: PodMonitor
                spec:
                  selector:
                    matchLabels:
                      uat/canary: peer
                      uat/run: "{{ uat_run_id }}"
                  podMetricsEndpoints:
                    - port: metrics

        - name: peer-check
          ansible.builtin.include_role:
            name: uat_pod
          vars:
            step:
              name: peer-check
              image: registry.redhat.io/ubi9/ubi:9.8
              peer: true
              labelFilter: peer-check
              env:
                - name: METRIC_NAME
                  value: '{{ canaryMetricName }}'
                - name: RUN_ID
                  value: '{{ uat_run_id }}'
                - name: CANARY_URL
                  value: '{{ services["peer-canary"].url }}'
                - name: THANOS_TENANCY_URL
                  value: '{{ thanosTenancy }}'

        - name: project-check
          ansible.builtin.include_role:
            name: uat_pod
          vars:
            step:
              name: project-check
              image: registry.redhat.io/ubi9/ubi:9.8
              labelFilter: project-check
              env:
                - name: METRIC_NAME
                  value: '{{ canaryMetricName }}'
                - name: RUN_ID
                  value: '{{ uat_run_id }}'
                - name: CANARY_URL
                  value: '{{ services["project-canary"].url }}'
                - name: PEER_NAMESPACE
                  value: '{{ serverConfig.peerNamespace }}'
                - name: THANOS_TENANCY_URL
                  value: '{{ thanosTenancy }}'
                - name: THANOS_WEB_URL
                  value: '{{ thanosWeb }}'
                - name: READER_TOKEN_FILE
                  value: /var/run/secrets/uat-reader/token
              volumes:
                - name: reader-token
                  secret:
                    secretName: '{{ readerSecretName }}'
              volumeMounts:
                - name: reader-token
                  mountPath: /var/run/secrets/uat-reader
                  readOnly: true
      rescue:
        - name: Handle the failure
          ansible.builtin.import_role:
            name: uat_sequence
            tasks_from: failed
      always:
        - name: Tear down
          ansible.builtin.import_role:
            name: uat_sequence
            tasks_from: teardown
